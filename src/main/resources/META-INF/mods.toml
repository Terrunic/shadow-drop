modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Terrunic/shadow-drop/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''
# Client-only: don't require the mod on servers
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${ mod_id }]]
modId = "yet_another_config_lib_v3"
mandatory = false
versionRange = "[${yacl_version},)"
ordering = "NONE"
side = "CLIENT"
